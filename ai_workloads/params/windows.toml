# Platform: Windows llama.cpp (Vulkan, RX 6750 XT) on the DESKTOP (Ryzen 9 5900XT).
# The harness runs in WSL and launches the Windows llama.exe through WSL interop
# (model path converted with wslpath -w, GGML_* env passed via WSLENV).
# Linux perf cannot see inside a Windows .exe, so the perf scripts refuse this platform.
# Loaded together with params/llama.toml.

[platform]
# Windows paths; %VARS% are expanded on the machine, so no user name is stored here.
llama = '%USERPROFILE%\llama-b11429-win-vulkan\llama.exe'
model = '%USERPROFILE%\llama-b11429-win-vulkan\Qwen3.5-0.8B-Q8_0.gguf'
gpu = true

# ------------------------------------------------- overrides of llama.toml ----
[override.threads]
max = 32
default = 16
note = "CPU worker threads. 16 cores / 32 HW threads (SMT siblings 2n, 2n+1)."

[override.cpu_mask]
values = ["0x0", "0x5555", "0xFFFF", "0x55555555", "0xFFFFFFFF"]
note = "0x0 = none; 0x5555 / 0xFFFF = cores 0-7 (assumed first CCD), one / both HW threads; 0x55555555 = one HW thread per core; 0xFFFFFFFF = all."

[override.device]
values = ["auto", "none", "Vulkan0"]

[override.prio]
values = ["0", "1", "2"]
root = false
enabled = true
note = "0 normal, 1 medium, 2 high. 3 (realtime) needs admin, so it is left out."

# -------------------------------------------------------------- powercfg ----
# Windows power plan (active scheme, AC values), written with powercfg.exe
# /setacvalueindex SCHEME_CURRENT <sub> <setting> <value> + /setactive SCHEME_CURRENT.
# Works without admin (probe 2026-10-29). key = "<subgroup alias> <setting alias>".
# Defaults = values of this desktop's "High performance" plan (probe 2026-10-29).
# These change the host power plan, so they also act on WSL (unmeasured).

[[knob]]
name = "win_max_state"
layer = "powercfg"
key = "SUB_PROCESSOR PROCTHROTTLEMAX"
type = "int"
min = 5
max = 100
default = 100
note = "Maximum processor state (%). < 100 caps the frequency."

[[knob]]
name = "win_min_state"
layer = "powercfg"
key = "SUB_PROCESSOR PROCTHROTTLEMIN"
type = "int"
min = 5
max = 100
default = 100
note = "Minimum processor state (%). Constraint: <= win_max_state."

[[knob]]
name = "win_boost_mode"
layer = "powercfg"
key = "SUB_PROCESSOR PERFBOOSTMODE"
type = "enum"
values = ["0", "1", "2", "3", "4", "5", "6"]
default = "2"
note = "0 Disabled, 1 Enabled, 2 Aggressive, 3 Efficient Enabled, 4 Efficient Aggressive, 5 Aggressive at Guaranteed, 6 Efficient Aggressive at Guaranteed."

[[knob]]
name = "win_boost_policy"
layer = "powercfg"
key = "SUB_PROCESSOR PERFBOOSTPOL"
type = "int"
min = 0
max = 100
default = 100
note = "Processor performance boost policy (%)."

[[knob]]
name = "win_epp"
layer = "powercfg"
key = "SUB_PROCESSOR PERFEPP"
type = "int"
min = 0
max = 100
default = 10
note = "Energy performance preference: 0 = max performance, 100 = max efficiency."

[[knob]]
name = "win_core_parking_min"
layer = "powercfg"
key = "SUB_PROCESSOR CPMINCORES"
type = "int"
min = 0
max = 100
default = 100
note = "Minimum unparked cores (%). 100 = no parking."

[[knob]]
name = "win_perf_inc_policy"
layer = "powercfg"
key = "SUB_PROCESSOR PERFINCPOL"
type = "enum"
values = ["0", "1", "2", "3"]
default = "2"
enabled = false
note = "0 Ideal, 1 Single, 2 Rocket, 3 IdealAggressive."

[[knob]]
name = "win_idle_disable"
layer = "powercfg"
key = "SUB_PROCESSOR IDLEDISABLE"
type = "bool"
default = false
enabled = false
note = "Disable processor idle states. Raises power/heat; off by default."
